<!DOCTYPE html>
<html lang="am">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Bingo - አራዳ ቢንጎ</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap');
        body { font-family: 'Poppins', sans-serif; background-color: #0d1b2a; color: #ffffff; }
        .bingo-cell { transition: all 0.2s ease; }
        .bingo-cell.marked { background: linear-gradient(135deg, #2ec4b6, #20bf6b); color: white; transform: scale(0.95); font-weight: bold; box-shadow: 0 0 10px rgba(46, 196, 182, 0.5); }
    </style>
</head>
<body class="flex flex-col min-h-screen p-4 max-w-md mx-auto">
    <header class="text-center my-4">
        <h1 class="text-3xl font-bold text-yellow-400 tracking-wider">🎯 SMART BINGO</h1>
        <p class="text-xs text-gray-300">አራዳ ቢንጎ - የሞባይል ጨዋታ</p>
    </header>

    <main class="flex-1 flex flex-col gap-4">
        <div class="bg-slate-800 p-4 rounded-xl border border-yellow-500/30 text-center shadow-lg">
            <span class="text-sm text-yellow-400 uppercase tracking-widest">የተጠራው ቁጥር (Current Call)</span>
            <div id="currentCallDisplay" class="text-5xl font-extrabold text-white my-2">-</div>
        </div>

        <div class="bg-slate-800/80 p-3 rounded-xl border border-slate-700">
            <div class="text-xs font-semibold text-gray-400 mb-2">የዋና ሰሌዳ ቁጥሮች (Master Board 1-75)</div>
            <div id="masterGrid" class="grid grid-cols-10 gap-1 text-center text-xs"></div>
        </div>

        <div class="bg-slate-800 p-4 rounded-xl border border-slate-700 text-center">
            <div class="flex justify-between items-center mb-2">
                <span class="text-sm font-bold text-yellow-400">የእርስዎ ካርቴላ (Cartela #1)</span>
                <button onclick="alert('አዲስ ካርቴላ ተመርጧል!')" class="bg-yellow-500 text-slate-900 text-xs px-2 py-1 rounded font-bold">ቀይር</button>
            </div>
            <div id="playerCard" class="grid grid-cols-5 gap-2"></div>
        </div>
    </main>

    <footer class="mt-4 text-center">
        <button onclick="alert('ቢንጎ! አሸናፊዎትን እያረጋገጠ ነው...')" class="w-full bg-gradient-to-r from-yellow-500 to-amber-600 text-slate-900 font-bold py-3 rounded-xl shadow-lg text-lg">
            🎉 BINGO! (አሸነፍኩ)
        </button>
    </footer>

    <script>
        // Web Audio API ለድምፅ ማመንጫ (Beep Sound)
        function playCallSound() {
            try {
                const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                const oscillator = audioCtx.createOscillator();
                const gainNode = audioCtx.createGain();

                oscillator.type = 'sine';
                oscillator.frequency.setValueAtTime(600, audioCtx.currentTime); // የድምፁ ከፍታ
                gainNode.gain.setValueAtTime(0.1, audioCtx.currentTime);

                oscillator.connect(gainNode);
                gainNode.connect(audioCtx.destination);

                oscillator.start();
                oscillator.stop(audioCtx.currentTime + 0.15); // የድምፁ ቆይታ (ጊዜ)
            } catch (e) {
                console.log("Audio not supported or blocked", e);
            }
        }

        // Master Board Generation (1-75)
        const masterGrid = document.getElementById('masterGrid');
        for (let i = 1; i <= 75; i++) {
            const cell = document.createElement('div');
            cell.id = `m-${i}`;
            cell.className = 'bg-slate-700/50 py-1 rounded text-gray-300';
            cell.innerText = i;
            masterGrid.appendChild(cell);
        }

        // Simple Player Card Mock
        const playerCard = document.getElementById('playerCard');
        const sampleNumbers = [12, 25, 38, 44, 60, 5, 18, 'FREE', 50, 71, 9, 22, 31, 49, 65, 3, 20, 39, 52, 68, 15, 27, 40, 55, 73];
        sampleNumbers.forEach((num, index) => {
            const cell = document.createElement('div');
            cell.className = `p-3 bg-slate-700 rounded-lg text-center font-bold text-sm bingo-cell ${num === 'FREE' ? 'marked' : ''}`;
            cell.innerText = num;
            if(num !== 'FREE') {
                cell.onclick = () => cell.classList.toggle('marked');
            }
            playerCard.appendChild(cell);
        });

        // Simulate a random call for testing with Sound
        setInterval(() => {
            const randomNum = Math.floor(Math.random() * 75) + 1;
            document.getElementById('currentCallDisplay').innerText = randomNum;
            
            // ቁጥር ሲጠራ ድምፅ እንዲያሰማ ፉንክሽኑን መጥራት
            playCallSound();

            const mCell = document.getElementById(`m-${randomNum}`);
            if(mCell) mCell.classList.add('bg-yellow-500', 'text-slate-900', 'font-bold');
        }, 5000);
    </script>
</body>
</html>
