<!DOCTYPE html>
<html lang="am">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Arada Classic Bingo - አራዳ ቢንጎ</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://www.gstatic.com/firebasejs/10/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/10/firebase-auth.js"></script>
<script src="https://www.gstatic.com/firebasejs/10/firebase-firestore.js"></script>
<style>
*{box-sizing:border-box}
body{background:#f3e8ff;color:#1e1b4b;font-family:sans-serif}
.bingo-cell{padding:12px 2px;background:#e2e8f0;border-radius:6px;text-align:center;font-weight:bold}
.bingo-cell.marked{background:#f97316;color:white}
.master-cell{padding:6px 2px;background:#e2e8f0;border-radius:4px;text-align:center;font-size:12px;font-weight:bold}
.master-cell.called{background:#f97316;color:white}
.master-cell.latest{background:#22c55e;color:white}
button{cursor:pointer}
button:disabled{opacity:.5;cursor:not-allowed}
</style>
</head>
<body class="p-4 flex flex-col items-center min-h-screen">

    <h1 class="text-2xl font-bold mb-4 text-purple-900">አራዳ ቢንጎ (Arada Bingo)</h1>

    <!-- Current Call & Recent Calls Section -->
    <div class="flex flex-col items-center justify-center my-4 p-4 bg-purple-800 rounded-2xl shadow-lg text-white w-11/12 max-w-md mx-auto">
        
        <!-- Current Call Banner -->
        <div class="flex items-center justify-between w-full bg-purple-900 rounded-xl p-4 mb-3 shadow-inner">
            <span class="text-xl font-bold tracking-wide">Current Call</span>
            <div id="current-call-badge" class="w-16 h-16 bg-orange-500 rounded-full flex items-center justify-center text-xl font-extrabold shadow-md animate-pulse">
                --
            </div>
        </div>

        <!-- Recent Calls History Circles -->
        <div class="flex items-center justify-center space-x-3 bg-purple-900/50 p-3 rounded-xl w-full">
            <div id="recent-1" class="w-12 h-12 bg-blue-600 rounded-full flex items-center justify-center text-sm font-bold shadow">--</div>
            <div id="recent-2" class="w-12 h-12 bg-red-600 rounded-full flex items-center justify-center text-sm font-bold shadow">--</div>
            <div id="recent-3" class="w-12 h-12 bg-blue-600 rounded-full flex items-center justify-center text-sm font-bold shadow">--</div>
        </div>

        <!-- Auto Mode Switch -->
        <div class="flex items-center justify-between w-full mt-4 bg-purple-900/70 px-4 py-3 rounded-xl">
            <span class="text-lg font-medium">Auto</span>
            <label class="relative inline-flex items-center cursor-pointer">
                <input type="checkbox" id="auto-toggle" class="sr-only peer">
                <div class="w-11 h-6 bg-gray-300 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-orange-500"></div>
            </label>
        </div>
    </div>

    <!-- ዋናው የጨዋታ ማሳያ (መጫወቻው የሚቀጥልበት ቦታ) -->
    <div id="game-container" class="w-full max-w-md bg-white p-4 rounded-2xl shadow-md mt-2">
        <!-- የካርቴላ እና የቁጥር መጥሪያ ክፍሎች -->
    </div>

</body>
</html>
